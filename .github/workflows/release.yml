name: Release runtimes

# Rebuilds the binaries that ship inside the plugin. A Copilot plugin install is
# a plain file copy, so whatever is committed under runtimes/ is exactly what
# users execute -- this workflow is how that gets refreshed.
#
# Native AOT cannot cross-compile between operating systems ("Cross-OS native
# compilation is not supported"), so every OS needs its own runner. Architectures
# within one OS do cross-compile, which is why macOS builds both its slices.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into every file that carries one
        required: false
      commit:
        description: Open a PR with the refreshed runtimes
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # One unavailable architecture should not hide whether the others work.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64,   os: macos-15 }
          - { rid: osx-x64,     os: macos-15 }
          - { rid: win-x64,     os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          # ARM runners are not offered on every plan, so these may be skipped
          # without failing the release.
          - { rid: win-arm64,   os: windows-11-arm, optional: true }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, optional: true }
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The binary bakes its version in at compile time, so this has to happen
      # before the build rather than alongside the bundling.
      - name: Stamp version
        if: inputs.version != ''
        shell: bash
        run: node scripts/stamp-version.mjs "${{ inputs.version }}"

      - name: Build
        shell: bash
        run: ./scripts/build.sh "${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.rid }}
          path: .build/bin/${{ matrix.rid }}/mobile-*
          if-no-files-found: error
          retention-days: 1

  bundle:
    needs: build
    # Runs even when an optional architecture was unavailable, so a release
    # ships whatever did build rather than nothing.
    if: always()
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          path: .build/artifacts
          pattern: bin-*

      - name: Require core runtime builds
        run: |
          for rid in osx-arm64 osx-x64 win-x64 linux-x64; do
            test -d ".build/artifacts/bin-$rid" || {
              echo "required runtime did not build: $rid" >&2
              exit 1
            }
          done

      - name: Stamp version
        if: inputs.version != ''
        run: node scripts/stamp-version.mjs "${{ inputs.version }}"

      # bundle.mjs merges into the existing manifest, so bundling each downloaded
      # architecture in turn produces one manifest covering all of them.
      - name: Bundle every architecture that built
        run: |
          shopt -s nullglob
          rm -rf runtimes
          mkdir runtimes
          found=0
          for dir in .build/artifacts/bin-*; do
            rid="${dir##*/bin-}"
            echo "::group::$rid"
            node scripts/bundle.mjs --rid "$rid" --from "$dir"
            echo "::endgroup::"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "no architectures built" >&2
            exit 1
          fi
          echo "bundled $found architecture(s)"

      - name: Verify
        run: |
          node scripts/verify-bundle.mjs
          dotnet test MobileCanvas.slnx -c Release

      - name: Package runtime release assets
        run: npm run package:runtimes

      - name: Package Copilot plugin
        run: |
          npm run package:plugin
          node scripts/verify-plugin.mjs .build/copilot-plugin/mobile-canvas
          npm run package:plugin:thin
          node scripts/verify-plugin.mjs .build/copilot-plugin-thin/mobile-canvas

      - name: Package VS Code extension
        run: |
          npm ci --prefix vscode --ignore-scripts
          npm run package --prefix vscode

      - name: Package platform-specific VS Code extensions
        run: |
          npm run package:thin --prefix vscode
          npm run package:targets --prefix vscode

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-runtime-assets
          path: .build/release-assets
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-copilot-plugin
          path: .build/copilot-plugin/mobile-canvas
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-copilot-plugin-thin
          path: .build/copilot-plugin-thin/mobile-canvas
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-vscode
          path: .build/mobile-canvas-vscode*.vsix
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            .build/release-assets/* \
            .build/mobile-canvas-vscode*.vsix \
            .build/mobile-canvas-copilot-plugin-*.tar.gz \
            --clobber

      - name: Summarise
        run: |
          {
            echo '## Bundled runtimes'
            echo
            node -e '
              const m = require("./runtimes/manifest.json");
              for (const [key, e] of Object.entries(m.runtimes)) {
                const mb = Object.values(e.files)
                  .reduce((n, f) => n + f.size, 0) / 1024 / 1024;
                const files = Object.keys(e.files).length;
                console.log(`- \`${key}\` (${e.rid}) -- ${mb.toFixed(1)} MB, ${files} file(s)`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: peter-evans/create-pull-request@v7
        if: inputs.commit
        with:
          branch: release/runtimes
          title: Refresh bundled runtimes
          commit-message: Refresh bundled runtimes
          body: |
            Rebuilt the Native AOT binaries that ship inside the plugin.

            Generated by the `Release runtimes` workflow.
          add-paths: |
            runtimes
            package.json
            vscode/package.json
            vscode/package-lock.json
            Directory.Build.props
            .github/plugin/plugin.json
            .github/plugin/marketplace.json
