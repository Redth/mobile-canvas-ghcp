name: Release runtimes

# Rebuilds the binaries that ship inside the plugin. A Copilot plugin install is
# a plain file copy, so whatever is committed under runtimes/ is exactly what
# users execute -- this workflow is how that gets refreshed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into package.json
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bundle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Stamp version
        if: inputs.version != ''
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
        env:
          VERSION: ${{ inputs.version }}

      # Native AOT cross-compiles between macOS architectures, so one runner
      # produces both slices and both get the identical universal Swift helper.
      - name: Build and bundle both macOS architectures
        run: |
          for rid in osx-arm64 osx-x64; do
            ./scripts/build.sh "$rid"
            node scripts/bundle.mjs --rid "$rid" --from ".build/bin/$rid"
          done

      - name: Verify
        run: |
          node scripts/verify-bundle.mjs
          dotnet test MobileCanvas.slnx -c Release

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: release/runtimes
          title: Refresh bundled runtimes
          commit-message: Refresh bundled runtimes
          body: |
            Rebuilt the Native AOT binaries that ship inside the plugin.

            Generated by the `Release runtimes` workflow.
          add-paths: |
            runtimes
            package.json
