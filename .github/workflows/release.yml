name: Release runtimes

# Rebuilds and publishes the native runtime assets. The repository keeps only
# their checksummed manifest; release packaging may still embed the freshly
# built archives for self-contained artifacts.
#
# Native AOT cannot cross-compile between operating systems ("Cross-OS native
# compilation is not supported"), so every OS needs its own runner. Architectures
# within one OS do cross-compile, which is why macOS builds both its slices.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into every file that carries one
        required: false
      prerelease_tag:
        description: Publish a prerelease tag (for example v0.1.7-rc.1) for end-to-end testing
        required: false
      publish_marketplace:
        description: Publish the VS Code extension to the Marketplace
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    # One unavailable architecture should not hide whether the others work.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS runner can cross-compile both architectures. Keeping them
          # together avoids competing for two scarce macOS hosted runners.
          - { key: osx,         rids: "osx-arm64 osx-x64", os: macos-14 }
          - { key: win-x64,     rids: "win-x64",           os: windows-latest }
          - { key: linux-x64,   rids: "linux-x64",         os: ubuntu-latest }
          # ARM runners are not offered on every plan, so these may be skipped
          # without failing the release.
          - { key: win-arm64,   rids: "win-arm64",         os: windows-11-arm, optional: true }
          - { key: linux-arm64, rids: "linux-arm64",       os: ubuntu-24.04-arm, optional: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The binary bakes its version in at compile time, so this has to happen
      # before the build rather than alongside the bundling.
      - name: Stamp tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/stamp-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Stamp version
        if: inputs.version != ''
        shell: bash
        run: node scripts/stamp-version.mjs "${{ inputs.version }}"

      - name: Build
        shell: bash
        run: |
          for rid in ${{ matrix.rids }}; do
            ./scripts/build.sh "$rid"
          done

      - name: Test bundled CoreSimulator HID
        if: matrix.key == 'osx'
        shell: bash
        run: |
          ./native/mobile-screencap/test.sh --arch arm64
          ./native/mobile-screencap/test.sh --arch x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.key }}
          path: .build/bin/*/mobile-*
          if-no-files-found: error
          retention-days: 1

  bundle:
    needs: build
    # Runs even when an optional architecture was unavailable, so a release
    # ships whatever did build rather than nothing.
    if: always()
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          path: .build/artifacts
          pattern: bin-*

      - name: Require core runtime builds
        run: |
          for rid in osx-arm64 osx-x64 win-x64 linux-x64; do
            find ".build/artifacts" -type f \
              \( -path "*/$rid/mobile-canvas" -o -path "*/$rid/mobile-canvas.exe" \) \
              | grep -q . || {
              echo "required runtime did not build: $rid" >&2
              exit 1
            }
          done

      - name: Stamp tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/stamp-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Stamp version
        if: inputs.version != ''
        run: node scripts/stamp-version.mjs "${{ inputs.version }}"

      - name: Validate prerelease inputs
        if: inputs.prerelease_tag != ''
        run: |
          test -n "${{ inputs.version }}" || {
            echo "version is required when prerelease_tag is set" >&2
            exit 1
          }
          case "${{ inputs.prerelease_tag }}" in
            v*-rc.*) ;;
            *)
              echo "prerelease_tag must match v*-rc.*" >&2
              exit 1
              ;;
          esac
          gh release view "${{ inputs.prerelease_tag }}" >/dev/null 2>&1 && {
            echo "prerelease already exists: ${{ inputs.prerelease_tag }}" >&2
            exit 1
          }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      # bundle.mjs merges into the existing manifest, so bundling each downloaded
      # architecture in turn produces one manifest covering all of them.
      - name: Bundle every architecture that built
        run: |
          shopt -s nullglob
          rm -rf runtimes
          mkdir runtimes
          found=0
          while IFS= read -r executable; do
            dir="${executable%/*}"
            rid="${dir##*/}"
            if [[ "$rid" == bin-* ]]; then
              rid="${rid#bin-}"
            fi
            case "$rid" in
              osx-arm64|osx-x64|win-x64|win-arm64|linux-x64|linux-arm64) ;;
              *) continue ;;
            esac
            echo "::group::$rid"
            MOBILE_CANVAS_RELEASE_TAG="${{ inputs.prerelease_tag }}" \
              node scripts/bundle.mjs --rid "$rid" --from "$dir"
            echo "::endgroup::"
            found=$((found + 1))
          done < <(
            find .build/artifacts -type f \
              \( -name mobile-canvas -o -name mobile-canvas.exe \) \
              | sort
          )
          if [ "$found" -eq 0 ]; then
            echo "no architectures built" >&2
            exit 1
          fi
          echo "bundled $found architecture(s)"

      - name: Verify
        run: |
          node scripts/verify-bundle.mjs
          node scripts/smoke-runtime.mjs
          dotnet test MobileCanvas.slnx -c Release

      - name: Package runtime release assets
        run: npm run package:runtimes

      - name: Package Copilot plugin
        run: |
          npm run package:plugin
          node scripts/verify-plugin.mjs .build/copilot-plugin/mobile-canvas
          npm run package:plugin:thin
          node scripts/verify-plugin.mjs .build/copilot-plugin-thin/mobile-canvas

      - name: Package VS Code extension
        run: |
          npm ci --prefix vscode --ignore-scripts
          npm run package --prefix vscode

      - name: Package platform-specific VS Code extensions
        run: |
          npm run package:thin --prefix vscode
          npm run package:targets --prefix vscode

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-runtime-assets
          path: .build/release-assets
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-copilot-plugin
          path: .build/copilot-plugin/mobile-canvas
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-copilot-plugin-thin
          path: .build/copilot-plugin-thin/mobile-canvas
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-vscode
          path: .build/mobile-canvas-vscode*.vsix
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.prerelease_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.prerelease_tag || github.ref_name }}
        run: |
          if [[ -n "${{ inputs.prerelease_tag }}" ]]; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Mobile Canvas $RELEASE_TAG" \
              --notes "Release candidate for end-to-end artifact and runtime download validation."
          else
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
              || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            .build/release-assets/* \
            .build/mobile-canvas-vscode*.vsix \
            .build/mobile-canvas-copilot-plugin-*.tar.gz \
            --clobber

      - name: Summarise
        run: |
          {
            echo '## Bundled runtimes'
            echo
            node -e '
              const m = require("./runtimes/manifest.json");
              for (const [key, e] of Object.entries(m.runtimes)) {
                const mb = Object.values(e.files)
                  .reduce((n, f) => n + f.size, 0) / 1024 / 1024;
                const files = Object.keys(e.files).length;
                console.log(`- \`${key}\` (${e.rid}) -- ${mb.toFixed(1)} MB, ${files} file(s)`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare remote runtime manifest
        run: node scripts/prepare-remote-runtime-manifest.mjs

      - uses: peter-evans/create-pull-request@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          base: main
          branch: release/runtimes
          title: Refresh runtime manifest
          commit-message: Refresh runtime manifest
          body: |
            Rebuilt the Native AOT assets and refreshed the manifest for the next release.

            Generated by the `Release runtimes` workflow.
          add-paths: |
            runtimes/manifest.json
            package.json
            vscode/package.json
            vscode/package-lock.json
            Directory.Build.props
            .github/plugin/plugin.json
            .github/plugin/marketplace.json
            .claude-plugin/plugin.json
            .claude-plugin/marketplace.json

  publish-vscode:
    name: VS Code Marketplace
    needs: bundle
    # A tag publishes; a dispatch has to ask. Prerelease dispatches never reach
    # here, because the Marketplace has no concept of a release candidate.
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
      || (inputs.publish_marketplace && inputs.prerelease_tag == '')
    runs-on: ubuntu-latest
    # Holds the Entra identity's ids, and gives the publish a place to require
    # an approval without gating the rest of the release behind one.
    environment: vscode-marketplace
    permissions:
      # Mints the OIDC token azure/login exchanges for the identity. Declaring
      # any permission here replaces the workflow's defaults, so contents has to
      # be restated for checkout and `gh release view`.
      contents: read
      id-token: write
    env:
      # A tag run knows its own tag. A dispatch is normally re-running a publish
      # that failed, either from the tag itself or from a branch with the
      # version to republish, so fall back to the version it was given.
      RELEASE_TAG: >-
        ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name
        || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      # Publishes exactly what the release built and shipped, rather than
      # rebuilding it: a rebuild here could differ from the VSIXs users can
      # already download from the release.
      - uses: actions/download-artifact@v4
        with:
          name: mobile-canvas-vscode
          path: .build

      # The extension's own devDependencies are what pin vsce; --ignore-scripts
      # because nothing here needs the build hooks.
      - name: Install vsce
        run: npm ci --prefix vscode --ignore-scripts

      # Azure DevOps retires global PATs on 1 December 2026, so the publish
      # authenticates as an Entra identity instead. vsce resolves that token
      # through a chained credential that has no workload-identity link in it,
      # so the OIDC exchange cannot be handed to vsce directly -- azure/login
      # performs the exchange and leaves a logged-in Azure CLI behind, which is
      # the credential in that chain vsce does find.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The thin VSIX downloads its runtime from the release assets on first
      # use, so publishing before those exist would ship an extension that
      # cannot start. `needs: bundle` covers the tag path; this also catches a
      # dispatch pointed at a version that was never released.
      - name: Require published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$RELEASE_TAG" || {
            echo "no release tag: dispatch this from a tag, or pass a version" >&2
            exit 1
          }
          gh release view "$RELEASE_TAG" --json assets >/dev/null

      - name: Verify packages
        run: |
          for vsix in .build/mobile-canvas-vscode-*.vsix; do
            node scripts/verify-vsix.mjs "$vsix"
          done

      - name: Publish
        env:
          # vsce asks its credential chain for a token in this tenant. Only the
          # tenant is set: giving the chain a client id as well would send it
          # down the environment-credential path first, which has no secret to
          # go with it.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: node scripts/publish-vscode.mjs --version "$RELEASE_TAG"
