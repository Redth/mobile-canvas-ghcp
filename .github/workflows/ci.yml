name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Test
        run: dotnet test MobileCanvas.slnx -c Release

      # Several manifests carry the version, and they drift silently: the
      # marketplace manifests sat a whole release behind while the binary
      # shipped a newer number, so a bug report would name a version nobody
      # could install.
      - name: Check the version agrees everywhere
        run: node scripts/stamp-version.mjs --check

      # Plugin extension paths are containers whose immediate child directories
      # contain extension.mjs. Pointing at the extension directory itself is
      # accepted by the manifest but silently discovers no canvas.
      - name: Verify plugin extension layout
        run: node scripts/verify-plugin.mjs

      - name: Package Copilot plugin
        run: |
          npm run package:plugin
          node scripts/verify-plugin.mjs .build/copilot-plugin/mobile-canvas

      - name: Verify runtime manifest
        run: |
          node scripts/verify-bundle.mjs
          node scripts/smoke-runtime.mjs

      # Catches the published runtimes drifting behind src/. It compares a hash
      # of the source the release was built from rather than rebuilding:
      # Native AOT is not bit-reproducible, so a rebuild of unchanged source
      # differs anyway, and a check that fires every time hides real drift.
      - name: Check published runtimes match source
        run: |
          node -e '
            const m = require("./runtimes/manifest.json");
            console.log("published:", Object.keys(m.runtimes).join(", "));
          '
          node scripts/source-hash.mjs --check

      - name: Install VS Code extension dependencies
        run: npm ci --prefix vscode --ignore-scripts

      - name: Test VS Code extension
        run: npm test --prefix vscode

      - name: Package VS Code extension
        run: npm run package --prefix vscode

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-copilot-plugin-${{ github.sha }}
          path: .build/copilot-plugin/mobile-canvas
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-canvas-vscode-universal-${{ github.sha }}
          path: .build/mobile-canvas-vscode.vsix
          include-hidden-files: true
          if-no-files-found: error

  windows:
    name: Windows native helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test managed solution
        shell: bash
        run: dotnet test MobileCanvas.slnx -c Release

      # windows-latest has the MSVC ARM64 cross tools, so this gates both
      # release architectures without relying on a scarce hosted ARM runner.
      - name: Build Windows hosts and native helpers
        shell: bash
        run: |
          ./scripts/build.sh win-x64
          ./scripts/build.sh win-arm64

      - name: Verify required Windows artifacts
        shell: bash
        run: |
          for rid in win-x64 win-arm64; do
            test -f ".build/bin/$rid/mobile-canvas.exe"
            test -f ".build/bin/$rid/windows-app-helper.exe"
          done

      - name: Test x64 helper protocol
        shell: bash
        run: ctest --test-dir .build/native/windows-app-helper/win-x64 -C Release --output-on-failure

      - name: Smoke x64 helper capabilities
        shell: pwsh
        run: |
          $raw = & .\.build\bin\win-x64\windows-app-helper.exe capabilities --json
          if ($LASTEXITCODE -ne 0) {
            throw "windows-app-helper capabilities failed"
          }
          $capabilities = $raw | ConvertFrom-Json
          if (
            $capabilities.schemaVersion -ne 1 -or
            $capabilities.ok -ne $true -or
            -not $capabilities.architecture -or
            $null -eq $capabilities.features.authenticodeSignature.valid
          ) {
            throw "windows-app-helper returned an invalid capabilities report"
          }

      - name: Test runtime helper packaging rules
        shell: bash
        run: node --test tests/scripts/windows-helper-runtime.test.mjs
